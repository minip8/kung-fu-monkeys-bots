name: CI

# docs/build.md. header: sdk/c/kfm_bot.h is the engine's at engine.lock's commit. image: the
# build image builds, every examples/*/ builds in the sandbox, and the same examples built
# without docker (tools/build.sh with the same emsdk) are byte-identical to the sandbox's.
# play: every sandbox-built module plays against the reference bot without a fault. A
# repository without examples/*/ passes with a notice. service: the ladder service's format,
# clippy and tests (service/README.md) against a postgres:17 service container, a MinIO started
# in a step (the object store tests), the bot build image built on the runner and the released
# kfm_arena (the build worker's end-to-end tests: a real sandbox build, validation and the
# smoke match). cli: the kfm command line tool's format, clippy and tests (cli/README.md
# "Development"): against its fake ladder, and with the bot build image, the runner's emsdk clang
# and the released kfm_arena for the toolchain tests (kfm build of examples/, in the image and
# with --local byte for byte, and kfm test of the result).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  header:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: tools/check_header.sh

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t kfm-bot-build .
      - name: Build every example in the sandbox
        run: |
          mkdir -p out/sandbox
          shopt -s nullglob
          dirs=(examples/*/)
          [[ ${#dirs[@]} -gt 0 ]] || echo "::notice::no examples/*/ directories: nothing to build"
          for d in "${dirs[@]}"; do
            tools/build_in_sandbox.sh "$d" "out/sandbox/$(basename "$d")"
          done
          # Always something to upload, so the play job's download never fails.
          find out/sandbox -name bot.wasm | sort > out/sandbox/MODULES.txt
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13 # the emsdk of the Dockerfile's base image
      - name: Build every example without docker; compare with the sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y wabt
          export CLANG="$(dirname "$(command -v emcc)")/../bin/clang"
          shopt -s nullglob
          for d in examples/*/; do
            name="$(basename "$d")"
            tools/build.sh "$d" "out/local/$name.wasm"
            cmp "out/local/$name.wasm" "out/sandbox/$name/bot.wasm" ||
              { echo "::error::$name: the local build differs from the sandbox build"; exit 1; }
          done
          (cd out/sandbox && find . -name bot.wasm -exec sha256sum {} +) | sort -k 2
      - uses: actions/upload-artifact@v7
        with:
          name: modules
          path: out/sandbox/

  play:
    needs: image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: modules
          path: out/sandbox
      - name: Any modules?
        id: modules
        run: |
          if [[ -s out/sandbox/MODULES.txt ]]; then echo "any=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::no example modules: nothing to play"; fi
      # A release (engine.lock tag=) is downloaded; without one, the pinned commit is built.
      - uses: actions/cache@v6
        if: steps.modules.outputs.any
        with:
          path: .kfm/kfm_arena
          key: kfm_arena-${{ runner.os }}-${{ hashFiles('engine.lock', 'tools/build_kfm_arena.sh') }}
      - name: Get kfm_arena
        if: steps.modules.outputs.any
        run: |
          if grep -q '^tag=.' engine.lock; then tools/fetch_kfm_arena.sh
          elif [[ ! -x .kfm/kfm_arena ]]; then
            sudo apt-get update && sudo apt-get install -y cmake ninja-build
            tools/build_kfm_arena.sh
          fi
          .kfm/kfm_arena --help | head -n 1
      - name: Play every module against the reference bot
        if: steps.modules.outputs.any
        run: tools/play.sh .kfm/kfm_arena $(cat out/sandbox/MODULES.txt)

  service:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # #[sqlx::test] creates (and drops) one database per test on this server.
      DATABASE_URL: postgres://postgres:dev@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: always
      KFM_LADDER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      KFM_LADDER_TEST_BUILD_IMAGE: kfm-bot-build:local
      KFM_LADDER_ARENA: ${{ github.workspace }}/.kfm/kfm_arena
      KFM_LADDER_TEST_EXAMPLES: ${{ github.workspace }}/out/local
    steps:
      - uses: actions/checkout@v7
      # A service container cannot be given MinIO's `server` argument, so it starts here (the
      # compose file's image and credentials).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=kfm-dev -e MINIO_ROOT_PASSWORD=kfm-dev-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for _ in $(seq 60); do
            curl -fs http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      # The image job builds the same image; building it again here is simpler than shipping
      # 3.5 GB between jobs, and the emsdk base layer is the bulk of it either way.
      - name: Build the bot build image
        run: docker build -t kfm-bot-build:local .
      - name: Build the examples (for the module walker's test)
        run: |
          shopt -s nullglob
          mkdir -p out/local
          for d in examples/*/; do
            name="$(basename "$d")"
            KFM_BUILD_IMAGE=kfm-bot-build:local tools/build_in_sandbox.sh "$d" "out/sandbox/$name"
            cp "out/sandbox/$name/bot.wasm" "out/local/$name.wasm"
          done
      - uses: actions/cache@v6
        with:
          path: .kfm/kfm_arena
          key: kfm_arena-${{ runner.os }}-${{ hashFiles('engine.lock', 'tools/build_kfm_arena.sh') }}
      - name: Get kfm_arena
        run: |
          if grep -q '^tag=.' engine.lock; then tools/fetch_kfm_arena.sh
          elif [[ ! -x .kfm/kfm_arena ]]; then
            sudo apt-get update && sudo apt-get install -y cmake ninja-build
            tools/build_kfm_arena.sh
          fi
          .kfm/kfm_arena --help | head -n 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
      - name: Format
        run: cargo fmt --check --manifest-path service/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path service/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path service/Cargo.toml --locked

  cli:
    runs-on: ubuntu-26.04
    env:
      CARGO_TERM_COLOR: always
      KFM_TEST_BUILD_IMAGE: kfm-bot-build:local
      KFM_TEST_ARENA: ${{ github.workspace }}/.kfm/kfm_arena
    steps:
      - uses: actions/checkout@v7
      - name: Build the bot build image
        run: docker build -t kfm-bot-build:local .
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13 # the emsdk of the Dockerfile's base image
      - name: The emsdk clang for kfm build --local
        run: echo "CLANG=$(dirname "$(command -v emcc)")/../bin/clang" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: .kfm/kfm_arena
          key: kfm_arena-${{ runner.os }}-${{ hashFiles('engine.lock', 'tools/build_kfm_arena.sh') }}
      - name: Get kfm_arena
        run: |
          if grep -q '^tag=.' engine.lock; then tools/fetch_kfm_arena.sh
          elif [[ ! -x .kfm/kfm_arena ]]; then
            sudo apt-get update && sudo apt-get install -y cmake ninja-build
            tools/build_kfm_arena.sh
          fi
          .kfm/kfm_arena --help | head -n 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Format
        run: cargo fmt --check --manifest-path cli/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml --locked -- --nocapture
