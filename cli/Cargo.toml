[package]
name = "kfm-cli"
version = "0.1.9"
edition = "2021"
rust-version = "1.90"
resolver = "3"
description = "kfm, the Kung Fu Monkeys bot ladder's command line tool: log in, build, test, submit, matches and replays"
repository = "https://github.com/minip8/kung-fu-monkeys-bots"
readme = "README.md"
publish = false
build = "build.rs"

[[bin]]
name = "kfm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
flate2 = "1"
getrandom = "0.3"
hex = "0.4"
hostname = "0.4"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
toml = { version = "1.2.1", default-features = false, features = ["parse", "display", "serde"] }
url = "2"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
