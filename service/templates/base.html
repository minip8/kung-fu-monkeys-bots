<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kung Fu Monkeys ladder{% endblock %}</title>
<style>
  :root { --fg: #1d1b16; --muted: #6b6457; --bg: #fbf8f1; --card: #fff; --line: #e4ddcd; --accent: #c8761a; --bad: #a8321e; --good: #2f6b2a; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #efe9dc; --muted: #a59d8d; --bg: #17150f; --card: #211e17; --line: #3a3428; --accent: #f0a040; --bad: #f08060; --good: #8fcf7f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; }
  form.inline { display: inline; margin: 0; }
  form.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  input[type=text], select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; flex: 1 1 160px; }
  button, a.button { font: inherit; padding: 6px 12px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
  button.quiet { background: transparent; color: var(--accent); }
  .error { border-color: var(--bad); color: var(--bad); }
  .notice { border-color: var(--good); color: var(--good); }
  code.secret { display: block; padding: 8px; margin: 8px 0; background: var(--bg); border: 1px dashed var(--accent); border-radius: 6px; word-break: break-all; }
  .muted { color: var(--muted); }
  .signin a.button { margin: 0 8px 8px 0; }
  .team { margin: 0 0 16px; }
  h3 { font-size: 1rem; margin: 16px 0 6px; }
  .good { color: var(--good); }
  input[type=file] { font: inherit; min-width: 0; flex: 1 1 200px; }
  nav { margin: 0 0 16px; }
  nav a { margin-right: 16px; color: var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bad { color: var(--bad); }
  pre { overflow-x: auto; font-size: .8rem; background: var(--bg); padding: 8px; border-radius: 6px; border: 1px solid var(--line); }
  .pages a { margin-right: 12px; }
  .seasons a { margin-right: 12px; }
  .seasons strong { margin-right: 12px; }
  .scroll { overflow-x: auto; }
  footer { margin: 32px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
  footer a { margin-right: 16px; color: var(--accent); }
</style>
</head>
<body>
<main>
<nav><a href="/">Portal</a><a href="/ladder">Ladder</a></nav>
{% block content %}{% endblock %}
<footer><a href="/privacy">Privacy</a><a href="https://github.com/minip8/kung-fu-monkeys-bots">Source</a></footer>
</main>
</body>
</html>
