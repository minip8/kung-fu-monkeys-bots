[package]
name = "kfm-ladder"
version = "0.1.6"
edition = "2021"
rust-version = "1.90"
resolver = "3"
description = "Kung Fu Monkeys ladder service: accounts, tokens, teams, submissions, matches and ratings (docs/ladder-api.md)"
publish = false

[[bin]]
name = "kfm-ladder"
path = "src/main.rs"

[features]
default = ["sentry"]
sentry = ["dep:sentry", "dep:sentry-tracing"]

[dependencies]
askama = "0.16"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form", "query", "tracing", "multipart"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
subtle = "2"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
sentry = { version = "0.49", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = { version = "0.49", optional = true }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }

[dev-dependencies]
# Uploads in the tests (the service itself sends no multipart).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
